name: Automatic_Test_And_Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: 
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Playwright tests
        run: dotnet restore test/nPlaywrightTests/nPlaywrightTests.csproj
        
      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with: 
          config: p/csharp
          generateSarif: true
          
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Build
        run: dotnet build --configuration Debug --no-restore

      - name: Build Playwright tests
        run: dotnet build test/nPlaywrightTests/nPlaywrightTests.csproj --configuration Debug --no-restore

      - name: Install Playwright browsers
        run: pwsh test/nPlaywrightTests/bin/Debug/net8.0/playwright.ps1 install --with-deps

      - name: Test
        run: dotnet test --configuration Debug --no-build --verbosity normal