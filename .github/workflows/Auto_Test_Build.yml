name: Automatic_Test_And_Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: 
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Playwright tests
        run: dotnet restore test/nPlaywrightTests/nPlaywrightTests.csproj

      - name: Install Security Code Scan
        run: dotnet tool install --global security-scan
        
      - name: Run Security Code Scan
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          security-scan ./Chirp.sln --export=scsr.sarif
          
      - name: Debug - list files
        if: always()
        run: |
          pwd
          ls -la
          find . -name "*.sarif" 2>/dev/null || echo "No sarif files anywhere"
          
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: scsr.sarif

      - name: Build
        run: dotnet build --configuration Debug --no-restore

      - name: Build Playwright tests
        run: dotnet build test/nPlaywrightTests/nPlaywrightTests.csproj --configuration Debug --no-restore

      - name: Install Playwright browsers
        run: pwsh test/nPlaywrightTests/bin/Debug/net8.0/playwright.ps1 install --with-deps

      - name: Test
        run: dotnet test --configuration Debug --no-build --verbosity normal