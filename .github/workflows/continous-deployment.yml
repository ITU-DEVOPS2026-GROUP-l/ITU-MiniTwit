name: Continuous Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Remember to set the following secrets in your repository's settings:
# https://github.com/your_username/itu-minitwit-ci/settings/secrets/actions
# DOCKER_USERNAME
# DOCKER_PASSWORD
# SSH_USER
# SSH_KEY
# SSH_HOST //unused now
# SSH_HOST_BACKUP
# SSH_HOST_PRIMARY

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push minitwitimage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/minitwitimage:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/minitwitimage:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/minitwitimage:webbuildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/minitwitimage:webbuildcache,mode=max

      - name: Docker scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/minitwitimage:${{ github.sha }}
          exit-code: true
          only-severities: critical,high,medium,low

  deploy:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        host:
          - ${{ secrets.SSH_HOST_PRIMARY }}
          - ${{ secrets.SSH_HOST_BACKUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ matrix.host }}" >> ~/.ssh/known_hosts

      - name: Sync deployment files to server
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.SSH_USER }}@${{ matrix.host }}" "mkdir -p /minitwit /minitwit/Monitoring"

          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./remote_files/docker-compose.yml \
            ./remote_files/deploy.sh \
            "${{ secrets.SSH_USER }}@${{ matrix.host }}:/minitwit/"

          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./Monitoring/ \
            "${{ secrets.SSH_USER }}@${{ matrix.host }}:/minitwit/Monitoring/"

      - name: Run deploy script on server
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.SSH_USER }}@${{ secrets[matrix.host_secret] }}" \
          "export IMAGE_TAG='${{ needs.build.outputs.image_tag }}' CHIRP_DB_CONNECTION='${{ secrets.CHIRP_DB_CONNECTION }}'
          && bash /minitwit/deploy.sh"