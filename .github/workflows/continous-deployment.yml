name: Continuous Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Secrets required in repository settings:
# DOCKER_USERNAME
# DOCKER_PASSWORD
# SSH_USER
# SSH_KEY
# SSH_HOST_PRIMARY
# SSH_HOST_BACKUP
# CHIRP_DB_CONNECTION

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5730b3ab2b47d5e6ac9a3b5cf970b1b6264b4ce # v3

      - name: Build and push minitwitimage
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/minitwitimage:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/minitwitimage:webbuildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/minitwitimage:webbuildcache,mode=max

      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/minitwitimage:latest
          exit-code: true
          only-severities: critical,high

  deploy:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        host_secret:
          - SSH_HOST_PRIMARY
          - SSH_HOST_BACKUP

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets[matrix.host_secret] }}" >> ~/.ssh/known_hosts

      - name: Sync deployment files to server
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.SSH_USER }}@${{ secrets[matrix.host_secret] }}" \
            "mkdir -p /minitwit /minitwit/Monitoring"

          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./remote_files/docker-compose.yml \
            ./remote_files/deploy.sh \
            ./remote_files/nginx.conf \
            "${{ secrets.SSH_USER }}@${{ secrets[matrix.host_secret] }}:/minitwit/"

          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./Monitoring/ \
            "${{ secrets.SSH_USER }}@${{ secrets[matrix.host_secret] }}:/minitwit/Monitoring/"

      - name: Run deploy script on server
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.SSH_USER }}@${{ secrets[matrix.host_secret] }}" \
            "export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}' \
             CHIRP_DB_CONNECTION='${{ secrets.CHIRP_DB_CONNECTION }}' && \
             bash /minitwit/deploy.sh"
